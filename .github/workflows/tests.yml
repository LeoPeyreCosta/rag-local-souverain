name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installation
        run: python -m pip install -e ".[dev]"
      - name: Analyse statique
        run: python -m pyflakes src tests
      - name: Typage
        run: python -m mypy src
      - name: Tests et couverture (sans GPU ni Ollama)
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=85
