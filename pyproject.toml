[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-local-souverain"
version = "0.2.0"
description = "Interroger ses documents avec un modèle de langue 100 % local (Ollama), en ligne de commande ou par une interface web accessible."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Léo Peyre-Costa" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.30",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
rag-local = "rag_local.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_local = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
