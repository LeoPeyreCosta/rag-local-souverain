name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installation
        run: python -m pip install -e ".[dev]" pyflakes
      - name: Analyse statique
        run: python -m pyflakes src tests
      - name: Tests unitaires et validité des corpus (sans GPU ni modèle)
        run: python -m pytest -q
